name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build and start the shell
        env:
          BACMODS_GIT_COMMIT: ${{ github.sha }}
        run: docker compose up --build -d
      - name: Wait for the shell
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --max-time 3 --retry 30 --retry-delay 1 --retry-max-time 90 \
            --retry-all-errors http://localhost:3000/
      - run: npx playwright install --with-deps chromium
      - name: Test the checked-out build
        env:
          PLAYWRIGHT_EXPECT_BUILD: "1"
          PLAYWRIGHT_HTML_OPEN: never
        run: npm run test:e2e -- --reporter=list,html
      - name: Print container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/**/trace.zip
          if-no-files-found: ignore
      - name: Stop the shell
        if: always()
        run: docker compose down
