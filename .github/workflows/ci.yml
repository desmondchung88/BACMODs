name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    env:
      # The Docker build action would otherwise add a summary and upload a build record on every run.
      DOCKER_BUILD_SUMMARY: false
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@v4
      # Every run reuses saved image layers, but only runs on main save them: saving takes time,
      # and a cache saved on main can be read by every pull request.
      - name: Build the shell image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          provenance: false
          # The image name Docker Compose gives the web service, so it can start without building.
          tags: bacmods-web:latest
          build-args: BACMODS_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,ignore-error=true' || '' }}
      - name: Start the shell
        run: docker compose up -d --no-build
      - name: Wait for the shell
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --max-time 3 --retry 30 --retry-delay 1 --retry-max-time 90 \
            --retry-all-errors http://localhost:3000/
      - run: npx playwright install --with-deps chromium
      - name: Test the checked-out build
        env:
          PLAYWRIGHT_EXPECT_BUILD: "1"
          PLAYWRIGHT_HTML_OPEN: never
        run: npm run test:e2e -- --reporter=list,html
      - name: Print container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/**/trace.zip
          if-no-files-found: ignore
      - name: Stop the shell
        if: always()
        run: docker compose down
